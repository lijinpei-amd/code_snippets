set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",xterm*:Tc"
set -g prefix "C-t"
unbind-key "C-b"
bind-key "C-t" send-prefix
# Forward terminal focus events into tmux panes so embedded TUIs (nvim, claude)
# can react to focus changes. See ~/.config/nvim/init.lua for the nvim-side
# handling that propagates these into :terminal buffers.
set -g focus-events on
set-window-option -g mode-keys vi
# Auto-name each new session after its working directory: ws<NN> for worktrees
# under development/workspace/<NN>, otherwise the directory basename.
# name-session.sh handles the scheme, sanitization (tmux forbids '.' and ':' in
# names), deduplication, and skips sessions that were given an explicit name.
#
# The #{session_id} format is SINGLE-QUOTED inside run-shell on purpose: tmux
# expands it to a value like "$3", and run-shell passes the command through
# /bin/sh, which would otherwise expand "$3" as a positional parameter ("" =>
# wrong target, silent no-op). The single quotes stop sh from touching it.
# Do not remove them. See ~/.tmux/name-session.sh.
set-hook -g session-created "run-shell \"~/.tmux/name-session.sh '#{session_id}'\""
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
# Must be the last line: bootstraps tpm and the @plugin entries above.
run '~/.tmux/plugins/tpm/tpm'
