# ccache configuration — managed by stow (dotfiles/ccache).
#
# Goal: share one cache across all the LLVM worktrees under development/, so
# that byte-identical sources compiled in workspace/01/llvm-project and
# workspace/02/llvm-project hit instead of each worktree keeping a private,
# path-keyed silo (which sat at ~12% hit rate).
#
# How the cross-worktree sharing works (all three are required):
#   * base_dir  — rewrite absolute paths under this dir to paths relative to
#                 the build dir (CWD) before hashing, so the differing
#                 workspace/NN/llvm-project prefix cancels out. Only works when
#                 the build dir lives *inside* the worktree (01-llvm-project.sh
#                 builds into <worktree>/build for exactly this reason).
#   * hash_dir  — don't fold the CWD into the hash (it's on by default for -g).
#   * sloppiness — trust header *contents*, ignore their checkout mtime/ctime
#                 (git worktree add stamps fresh timestamps on identical files).
#
# Correctness companion lives in the build, not here: the LLVM build passes
# -ffile-prefix-map (LLVM_USE_RELATIVE_PATHS_IN_FILES=ON,
# LLVM_SOURCE_PREFIX=/llvm-project/) so the cached .o is directory-neutral and
# safe to reuse in any worktree. See ~/.config/gdb/gdbinit for the debugger
# source-map that reverses it.

max_size = 150G
base_dir = /raid/jinpli/workspace/home/jinpli/development
hash_dir = false
sloppiness = include_file_mtime, include_file_ctime, locale
